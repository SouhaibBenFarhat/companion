name: Release Build (macOS zip)

# Runs when a GitHub Release is published (i.e. you publish the Release Drafter
# draft). Builds the app on a macOS runner, attaches the zip to that release,
# then bumps version + sha256 in the homebrew-tap cask so `brew upgrade` picks
# it up — no manual steps after clicking Publish.

on:
  release:
    types: [published]

permissions:
  contents: write # upload the zip to the release

jobs:
  build-and-publish:
    name: Build, attach zip & bump tap
    # macos-26 is required, not preferred. Transcription uses SpeechAnalyzer,
    # which does not exist in the macOS 15 SDK — and an @available check
    # cannot make an unknown type compile.
    runs-on: macos-26
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Derive version from tag
        id: version
        # Tag is like "v0.2.0"; the app bundle wants the bare "0.2.0".
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        run: scripts/build-app.sh "${{ steps.version.outputs.version }}"

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Companion-arm64.zip --clobber

      - name: Bump cask in homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(shasum -a 256 dist/Companion-arm64.zip | cut -d' ' -f1)

          git clone --depth 1 --branch master \
            "https://x-access-token:${TAP_TOKEN}@github.com/SouhaibBenFarhat/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/companion.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/companion.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "companion ${VERSION}"
          git push origin master
