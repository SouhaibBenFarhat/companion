name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Job names are referenced by branch protection as required checks —
    # keep "test" and "build" stable if you rename things.
    name: test
    # macos-26 is required, not preferred. Transcription uses SpeechAnalyzer,
    # which does not exist in the macOS 15 SDK — and an @available check
    # cannot make an unknown type compile.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generated but committed, because swift build links it. This catches
      # a change to Info.plist that was not carried across.
      - name: Check the development plist is not stale
        run: |
          scripts/make-dev-plist.sh
          if ! git diff --quiet packaging/Info.dev.plist; then
            echo "::error::packaging/Info.dev.plist is out of date — run scripts/make-dev-plist.sh"
            git diff packaging/Info.dev.plist
            exit 1
          fi

      - name: Run tests
        run: swift test

  build:
    name: build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Named separately from the bundle build so a token or kit rule failure
      # reads as itself rather than as "packaging broke".
      - name: Check the interface rules
        run: |
          npm --prefix web ci
          npm --prefix web test

      # Catches packaging breakage (Info.plist, icon, the web build, codesign)
      # on the PR instead of on release day.
      - name: Build the app bundle
        run: scripts/build-app.sh

      - name: Verify the ad-hoc signature
        run: codesign --verify --strict --verbose=2 dist/Companion.app

      # The panel is empty without these, and nothing else would notice.
      - name: Check the interface made it into the bundle
        run: test -f dist/Companion.app/Contents/Resources/web/index.html

      # A missing usage description does not warn — macOS terminates the app
      # the first time it touches the microphone, with nothing pointing at why.
      - name: Check the permission usage descriptions are present
        run: |
          PLIST=dist/Companion.app/Contents/Info.plist
          for key in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" 2>/dev/null || true)
            if [ -z "$value" ]; then
              echo "::error::$key is missing from Info.plist"
              exit 1
            fi
            if [ "${#value}" -lt 20 ]; then
              echo "::error::$key is too short to explain anything: $value"
              exit 1
            fi
            echo "ok  $key"
          done
