<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Companion open beside an editor and a video call during a pairing session on a MacBook">
  <title>Companion during a pairing session</title>

  <defs>
    <clipPath id="screen">
      <rect x="168" y="58" width="1264" height="742" rx="5"/>
    </clipPath>
  </defs>

  <!-- ================= MacBook ================= -->
  <rect x="150" y="40" width="1300" height="792" rx="24" fill="#1a1c22" stroke="#33374a" stroke-width="2"/>
  <circle cx="800" cy="50" r="3.5" fill="#33374a"/>
  <rect x="168" y="58" width="1264" height="742" rx="5" fill="#232842"/>
  <rect x="80" y="834" width="1440" height="24" rx="10" fill="#232630"/>
  <rect x="735" y="834" width="130" height="10" rx="5" fill="#1a1c22"/>

  <!-- wallpaper: flat shapes, no gradients, clipped to the screen -->
  <g clip-path="url(#screen)">
    <circle cx="470" cy="720" r="330" fill="#262c4c"/>
    <circle cx="1180" cy="180" r="240" fill="#262c4c"/>
  </g>

  <!-- ================= Menu bar ================= -->
  <rect x="168" y="58" width="1264" height="26" fill="#1b1e2c"/>
  <path d="M197 66.5c-1.6 0-2.6 1-3.6 1s-1.9-1-3.3-1c-1.8 0-3.5 1.5-3.5 4.3 0 2.7 2 5.7 3.4 5.7.9 0 1.4-.6 2.5-.6s1.5.6 2.5.6c1.5 0 3.2-2.9 3.2-4.5-1.9-.8-2.3-3.6-1.2-5.5z" fill="#9aa0b8"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12.5">
    <text x="212" y="76" font-weight="600" fill="#d4d8e6">Xcode</text>
    <text x="262" y="76" fill="#9aa0b8">File</text>
    <text x="298" y="76" fill="#9aa0b8">Edit</text>
    <text x="336" y="76" fill="#9aa0b8">Product</text>
    <text x="1382" y="76" fill="#d4d8e6">14:32</text>
  </g>

  <!-- Companion's menu bar mark: the open C with its dot -->
  <path d="M1287 65.4a6.8 6.8 0 1 0 0 11.2" fill="none" stroke="#d4d8e6" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="1289.6" cy="71" r="1.7" fill="#d4d8e6"/>
  <path d="M1318 76v-7M1324 76v-10M1330 76v-4.5" stroke="#9aa0b8" stroke-width="2" stroke-linecap="round"/>
  <rect x="1344" y="65" width="22" height="11" rx="3.5" fill="none" stroke="#9aa0b8" stroke-width="1.4"/>
  <rect x="1346" y="67" width="14" height="7" rx="2" fill="#9aa0b8"/>

  <!-- ================= Desktop icons ================= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11" fill="#e4e7f2" text-anchor="middle">
    <path d="M1348 112h16l5 7h27a4 4 0 0 1 4 4v27a4 4 0 0 1-4 4h-48a4 4 0 0 1-4-4v-34a4 4 0 0 1 4-4z" fill="#6f83d8"/>
    <text x="1374" y="176">companion</text>

    <path d="M1348 212h16l5 7h27a4 4 0 0 1 4 4v27a4 4 0 0 1-4 4h-48a4 4 0 0 1-4-4v-34a4 4 0 0 1 4-4z" fill="#6f83d8"/>
    <text x="1374" y="276">recordings</text>

    <rect x="1352" y="312" width="44" height="52" rx="5" fill="#e9ecf6"/>
    <path d="M1382 312h14v14z" fill="#b9c0d6"/>
    <g stroke="#8f97b0" stroke-width="2" stroke-linecap="round">
      <path d="M1360 328h22M1360 336h22M1360 344h14"/>
    </g>
    <text x="1374" y="380">notes.md</text>

    <rect x="1352" y="412" width="44" height="52" rx="5" fill="#e9ecf6"/>
    <path d="M1382 412h14v14z" fill="#b9c0d6"/>
    <circle cx="1367" cy="435" r="5" fill="#f0a848"/>
    <path d="M1358 452l10-12 7 8 5-5 6 9z" fill="#66b98a"/>
    <text x="1374" y="480">shot.png</text>
  </g>

  <!-- ================= Video call window ================= -->
  <rect x="900" y="120" width="350" height="210" rx="12" fill="#14161f" stroke="#2c3040" stroke-width="1.5"/>
  <path d="M900 132a12 12 0 0 1 12-12h326a12 12 0 0 1 12 12v16H900z" fill="#1d2130"/>
  <circle cx="918" cy="134" r="4.5" fill="#ff5f57"/>
  <circle cx="933" cy="134" r="4.5" fill="#febc2e"/>
  <circle cx="948" cy="134" r="4.5" fill="#28c840"/>
  <text x="1075" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11.5" fill="#a2a7bb">Meet — pairing</text>

  <!-- participant tiles -->
  <rect x="912" y="158" width="158" height="90" rx="8" fill="#2b3145"/>
  <circle cx="991" cy="192" r="15" fill="#8d96b8"/>
  <path d="M971 226a20 20 0 0 1 40 0z" fill="#8d96b8"/>
  <rect x="918" y="230" width="42" height="14" rx="4" fill="#191c28" fill-opacity="0.75"/>
  <text x="939" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="9.5" fill="#dfe3ef">Lena</text>

  <rect x="1080" y="158" width="158" height="90" rx="8" fill="#2b3145" stroke="#6C63FF" stroke-width="2"/>
  <circle cx="1159" cy="192" r="15" fill="#a3accd"/>
  <path d="M1139 226a20 20 0 0 1 40 0z" fill="#a3accd"/>
  <rect x="1086" y="230" width="34" height="14" rx="4" fill="#191c28" fill-opacity="0.75"/>
  <text x="1103" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="9.5" fill="#dfe3ef">You</text>

  <!-- call controls -->
  <circle cx="1035" cy="285" r="14" fill="#2b3145"/>
  <path d="M1035 279v7M1031 283v2a4 4 0 0 0 8 0v-2" stroke="#dfe3ef" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <circle cx="1075" cy="285" r="14" fill="#2b3145"/>
  <rect x="1067" y="280" width="11" height="10" rx="2.5" fill="#dfe3ef"/>
  <path d="M1080 282.5l4-2.5v10l-4-2.5z" fill="#dfe3ef"/>
  <circle cx="1115" cy="285" r="14" fill="#e0524a"/>
  <path d="M1108 286.5c4-3.5 10-3.5 14 0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- ================= Editor window ================= -->
  <rect x="210" y="140" width="650" height="540" rx="12" fill="#15171e" stroke="#2a2d38" stroke-width="1.5"/>
  <path d="M210 152a12 12 0 0 1 12-12h626a12 12 0 0 1 12 12v20H210z" fill="#1c1f28"/>
  <circle cx="232" cy="156" r="5" fill="#ff5f57"/>
  <circle cx="249" cy="156" r="5" fill="#febc2e"/>
  <circle cx="266" cy="156" r="5" fill="#28c840"/>
  <text x="294" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a2a7bb">AgentCommand.swift</text>
  <line x1="210" y1="172" x2="860" y2="172" stroke="#2a2d38" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <g fill="#585d70" text-anchor="end" font-size="12">
      <text x="256" y="200">41</text><text x="256" y="221">42</text><text x="256" y="242">43</text>
      <text x="256" y="263">44</text><text x="256" y="284">45</text><text x="256" y="305">46</text>
      <text x="256" y="326">47</text><text x="256" y="347">48</text><text x="256" y="368">49</text>
      <text x="256" y="389">50</text><text x="256" y="410">51</text><text x="256" y="431">52</text>
      <text x="256" y="452">53</text><text x="256" y="473">54</text><text x="256" y="494">55</text>
      <text x="256" y="515">56</text><text x="256" y="536">57</text><text x="256" y="557">58</text>
      <text x="256" y="578">59</text><text x="256" y="599">60</text>
    </g>

    <text x="272" y="200"><tspan fill="#d9a6ff">static func</tspan><tspan fill="#86c2f0"> build</tspan><tspan fill="#e9eaf0">(</tspan></text>
    <text x="303" y="221"><tspan fill="#e9eaf0">kind: </tspan><tspan fill="#86c2f0">AgentKind</tspan><tspan fill="#e9eaf0">,</tspan></text>
    <text x="303" y="242"><tspan fill="#e9eaf0">prompt: </tspan><tspan fill="#86c2f0">String</tspan><tspan fill="#e9eaf0">,</tspan></text>
    <text x="303" y="263"><tspan fill="#e9eaf0">sessionID: </tspan><tspan fill="#86c2f0">String</tspan><tspan fill="#e9eaf0">?</tspan></text>
    <text x="272" y="284"><tspan fill="#e9eaf0">) -&gt; </tspan><tspan fill="#86c2f0">AgentCommand</tspan><tspan fill="#e9eaf0"> {</tspan></text>
    <text x="303" y="305"><tspan fill="#d9a6ff">var</tspan><tspan fill="#e9eaf0"> arguments = [</tspan><tspan fill="#7fdcae">"-p"</tspan><tspan fill="#e9eaf0">, prompt]</tspan></text>

    <text x="303" y="347"><tspan fill="#d9a6ff">if let</tspan><tspan fill="#e9eaf0"> sessionID {</tspan></text>
    <text x="334" y="368"><tspan fill="#e9eaf0">arguments += [</tspan><tspan fill="#7fdcae">"--resume"</tspan><tspan fill="#e9eaf0">, sessionID]</tspan></text>
    <text x="303" y="389" fill="#e9eaf0">}</text>

    <text x="303" y="431" fill="#7d8194">// Required alongside stream-json in</text>
    <text x="303" y="452" fill="#7d8194">// print mode, or the CLI refuses to start.</text>
    <text x="303" y="473"><tspan fill="#e9eaf0">arguments += [</tspan><tspan fill="#7fdcae">"--verbose"</tspan><tspan fill="#e9eaf0">]</tspan></text>

    <text x="303" y="515"><tspan fill="#d9a6ff">return</tspan><tspan fill="#86c2f0"> AgentCommand</tspan><tspan fill="#e9eaf0">(</tspan></text>
    <text x="334" y="536" fill="#e9eaf0">executable: executable,</text>
    <text x="334" y="557" fill="#e9eaf0">arguments: arguments</text>
    <text x="303" y="578" fill="#e9eaf0">)</text>
    <text x="272" y="599" fill="#e9eaf0">}</text>
  </g>
  <rect x="303" y="608" width="1.8" height="15" fill="#7b73f5"/>

  <!-- ================= Companion panel ================= -->
  <rect x="900" y="350" width="350" height="352" rx="12" fill="#1b1c24" stroke="#4a4d66" stroke-width="1.5"/>

  <text x="916" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#a2a7bb">companion</text>
  <g stroke="#767b90" stroke-width="1.4" fill="none" stroke-linecap="round">
    <circle cx="1166" cy="371" r="5.5"/><path d="M1166 368v3.2l1.6 1"/>
    <path d="M1196 365.5v11M1190.5 371h11"/>
    <path d="M1222.5 367.5l7 7M1229.5 367.5l-7 7"/>
  </g>
  <line x1="900" y1="388" x2="1250" y2="388" stroke="#2f3242" stroke-width="1.5"/>

  <rect x="1004" y="400" width="232" height="30" rx="10" fill="#6C63FF"/>
  <text x="1016" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#ffffff">why is the retry firing twice?</text>

  <rect x="914" y="440" width="322" height="96" rx="10" fill="#23252f" stroke="#33364a" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#e9eaf0">
    <text x="928" y="462">The handler is attached in init and again</text>
    <text x="928" y="480">in run(), so each chunk fires both copies.</text>
    <text x="928" y="506" fill="#a2a7bb">AgentRunner.swift:58</text>
  </g>

  <rect x="1076" y="550" width="160" height="30" rx="10" fill="#6C63FF"/>
  <text x="1088" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#ffffff">show me the fix</text>

  <circle cx="922" cy="601" r="3.2" fill="#8b83ff"/>
  <text x="935" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#a2a7bb">Reading — AgentRunner.swift</text>

  <rect x="914" y="640" width="322" height="36" rx="11" fill="#23252f" stroke="#33364a" stroke-width="1"/>
  <text x="928" y="663" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#767b90">Ask about this repo…</text>
  <rect x="1200" y="647" width="22" height="22" rx="7" fill="#6C63FF"/>
  <path d="M1211 663.5v-9M1207.5 658l3.5-3.5 3.5 3.5" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="916" y="693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="10.5" fill="#6a6f84">Enter to send · Shift+Enter for a new line · Esc to hide</text>

  <!-- ================= Dock ================= -->
  <rect x="610" y="724" width="380" height="60" rx="17" fill="#2b3048" fill-opacity="0.92" stroke="#3d436090" stroke-width="1.5"/>
  <g>
    <rect x="638" y="732" width="44" height="44" rx="11" fill="#4d8ff0"/>
    <path d="M652 744h16v20h-16z" fill="#dfe9fb"/>
    <rect x="694" y="732" width="44" height="44" rx="11" fill="#2a4a86"/>
    <path d="M708 766l8-24 8 24-8-6z" fill="#e6edfa"/>
    <rect x="750" y="732" width="44" height="44" rx="11" fill="#15171c"/>
    <path d="M760 746l7 6-7 6M772 760h11" stroke="#8fe08f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="806" y="732" width="44" height="44" rx="11" fill="#f4f6fb"/>
    <rect x="815" y="746" width="18" height="16" rx="4" fill="#2f9e5a"/>
    <path d="M835 750l8-4v16l-8-4z" fill="#2f9e5a"/>
    <rect x="862" y="732" width="44" height="44" rx="11" fill="#15161c"/>
    <path d="M888.5 748.6a9.4 9.4 0 1 0 0 15.8" fill="none" stroke="#6C63FF" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="892" cy="756.5" r="2.4" fill="#6C63FF"/>
    <rect x="918" y="732" width="44" height="44" rx="11" fill="#8e93a3"/>
    <circle cx="940" cy="754" r="7" fill="none" stroke="#f4f6fb" stroke-width="3"/>
    <path d="M940 741v5M940 762v5M927 754h5M948 754h5" stroke="#f4f6fb" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
