<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" width="600" height="580" role="img" aria-label="The Companion panel: a question, an answer with a code block, and the input box">
  <title>The Companion panel</title>

  <rect x="40" y="30" width="520" height="500" rx="14" fill="#1b1c24" stroke="#4a4d66" stroke-width="1.5"/>

  <!-- header -->
  <text x="60" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="500" fill="#a2a7bb">companion</text>
  <g stroke="#767b90" stroke-width="1.5" fill="none" stroke-linecap="round">
    <circle cx="466" cy="52" r="6"/><path d="M466 48.6v3.6l1.8 1.1"/>
    <path d="M498 46v12M492 52h12"/>
    <path d="M527 47.5l8 8M535 47.5l-8 8"/>
  </g>
  <line x1="40" y1="70" x2="560" y2="70" stroke="#2f3242" stroke-width="1.5"/>

  <!-- question -->
  <rect x="278" y="84" width="264" height="32" rx="11" fill="#6C63FF"/>
  <text x="292" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" fill="#ffffff">why is the retry firing twice?</text>

  <!-- answer -->
  <rect x="58" y="128" width="484" height="212" rx="11" fill="#23252f" stroke="#33364a" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" fill="#e9eaf0">
    <text x="76" y="153">The handler is attached twice — once in init</text>
    <text x="76" y="172">and again in run(), so every chunk that</text>
    <text x="76" y="191">arrives fires both copies.</text>
  </g>

  <rect x="76" y="206" width="448" height="76" rx="8" fill="#16171d" stroke="#33364a" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="92" y="228"><tspan fill="#e9eaf0">output.fileHandleForReading</tspan></text>
    <text x="108" y="248"><tspan fill="#e9eaf0">.readabilityHandler = </tspan><tspan fill="#d9a6ff">nil</tspan></text>
    <text x="92" y="268" fill="#7d8194">// clear it before attaching again</text>
  </g>

  <text x="76" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" fill="#a2a7bb">AgentRunner.swift:58</text>

  <!-- working -->
  <circle cx="66" cy="366" r="3.6" fill="#8b83ff"/>
  <text x="80" y="371" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" fill="#a2a7bb">Reading — AgentRunner.swift</text>

  <!-- composer -->
  <rect x="58" y="420" width="484" height="44" rx="12" fill="#23252f" stroke="#33364a" stroke-width="1"/>
  <text x="76" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" fill="#767b90">Ask about this repo…</text>
  <rect x="504" y="429" width="26" height="26" rx="8" fill="#6C63FF"/>
  <path d="M517 449v-11M512.5 442.5l4.5-4.5 4.5 4.5" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="60" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11.5" fill="#6a6f84">Enter to send · Shift+Enter for a new line · Esc to hide</text>
</svg>
